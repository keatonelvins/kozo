name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv run --locked pytest
      - run: uv run kozo --out build
      - run: diff -r build fonts  # the committed fonts are what the code builds
